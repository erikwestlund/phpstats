name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a queued or running check of an older commit.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # The app's post-install artisan hooks want an environment the linter
      # does not need, so the autoloader is dumped without them.
      - run: composer install --no-interaction --no-progress --no-scripts

      - run: composer lint
